version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    ports:
      - 5432:5432
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=${POSTGRESQL_USER}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      - REPORT_USER=${REPORT_USER}
      - REPORT_PASSWORD=${REPORT_PASSWORD}
    volumes:
      - type: volume
        source: pgdata-viagem
        target: /var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro

  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_DATABASE=${POSTGRESQL_DATABASE}
      - DB_USER=${APP_USER}
      - DB_PASSWORD=${APP_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
      build:
        context: ./frontend
      ports:
        - "3000:3000"
      volumes:
        - ./frontend:/app
        - /app/node_modules
      depends_on:
        - api
      restart: unless-stopped

volumes:
  pgdata-viagem:
